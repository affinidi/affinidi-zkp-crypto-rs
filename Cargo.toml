[package]
name = "affinidi-zkp-crypto"
version = "0.1.0"
edition = "2021"
description = "A Rust library which provides Circom ecosystem, compatible with BabyJubJub EdDSA sign/verify primitives and Poseidon hashing with exports, used for mobile integrations"
license = "Apache-2.0"

[lib]
name = "rust_eddsa_helper"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "eddsa_cli"
path = "src/bin/eddsa_cli.rs"

[dependencies]
# Field arithmetic for BN254 (upgraded to 0.5.0 to match light-poseidon)
ark-bn254 = { version = "0.5.0", features = ["std"] }
ark-ff = { version = "0.5.0", features = ["std"] }
ark-ec = { version = "0.5.0", features = ["std"] }
ark-std = { version = "0.5.0", features = ["std"] }
ark-ed-on-bn254 = { version = "0.5.0", features = ["std"] }

# Poseidon hash - using light-poseidon which is Circom-compatible
light-poseidon = "0.3"

# Note: We need to implement EdDSA signing to match circomlibjs.signPoseidon()
# The exact algorithm may need to be reverse-engineered or found in circomlib source

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# FFI
libc = "0.2"

# Utilities
hex = "0.4"
num-bigint = "0.4"
zeroize = "1.8"

# Random number generation
rand = "0.8"

# Note: circomlibjs uses original BLAKE algorithm (SHA-3 proposal), not BLAKE2
# We implement BLAKE512 directly in src/blake.rs

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# iOS static lib: disable LTO so the .a contains real object files with C symbols
# (eddsa_sign, eddsa_free_string). Fat LTO can hide them from nm/dlsym.
# Build with: cargo build --release --target aarch64-apple-ios --profile ios
[profile.ios]
inherits = "release"
lto = false

